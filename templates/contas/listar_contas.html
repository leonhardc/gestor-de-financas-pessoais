{% extends "base.html" %}

{% block title %}Minhas Contas{% endblock %}

{% block content %}
<h1>Minhas Contas</h1>

<a href="{% url 'contas:nova_conta' %}">Nova Conta</a>

<ul>
    {% for conta in contas %}
        <li>
            {{ conta.nome }} - Saldo: R$ {{ conta.saldo }}
            <a href="{% url 'contas:ler_conta' conta.id %}">Ver</a>
            <a href="{% url 'contas:atualizar_conta' conta.id %}">Editar</a>
            <a href="{% url 'contas:deletar_conta' conta.id %}">Excluir</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
